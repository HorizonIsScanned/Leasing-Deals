name: Angebotsseiten prüfen

# Manuell: einzelne LeasingMarkt-Angebote mit der Leselogik des Radars prüfen (Ausgabe im Log, nichts wird geschrieben)

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Angebots-URLs (mit Leerzeichen getrennt)'
        required: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsx scripts/probe.ts
        env:
          URLS: ${{ inputs.urls }}
