name: Leasing-Scan

# Start über einen externen Taktgeber (workflow_dispatch) und als Reserve per Zeitplan: mydealz und LeasingMarkt lesen,
# Top-Angebote sofort melden, data/*.json committen (die Website liest sie beim Aufruf).

on:
  schedule:
    - cron: '41 5-22 * * *'
  workflow_dispatch:
    inputs:
      trocken:
        description: 'Probelauf: nichts melden, nichts schreiben'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: leasing-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm-Pakete aus dem Cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package.json') }}
      - run: npm install --no-audit --no-fund --prefer-offline
      - run: npm test
      # Telegram-Chat-ID zwischen den Läufen merken (nicht im öffentlichen Repository)
      - name: Telegram-Chat aus dem Cache
        uses: actions/cache@v4
        with:
          path: .cache/telegram.json
          key: telegram-${{ github.run_id }}
          restore-keys: telegram-
      - name: Scannen
        run: npm run scan
        env:
          TROCKEN: ${{ inputs.trocken && '1' || '' }}
          KEIN_ALARM: ${{ inputs.trocken && '1' || '' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
      # Die Website liest data/*.json beim Aufruf direkt aus dem Repository – kein Neubau nötig.
      - name: Daten committen
        if: ${{ !inputs.trocken }}
        run: |
          git config user.name "leasing-radar"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Keine Änderungen"
          else
            git commit -m "Daten $(date -u +'%F %H:%M')"
            git pull --rebase --autostash
            git push
          fi
